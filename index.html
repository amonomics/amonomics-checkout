    <!-- Error guard: Ignore Vite HMR WebSocket errors in iframe preview environment -->
    <script>
      (function() {
        function isViteWsError(err) {
          if (!err) return false;
          var str = String(err.message || err.reason || err.stack || err);
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          if (
            isViteWsError(event.error) ||
            isViteWsError(event.message) ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
